    <script>
        function createAudioPlayer(options) {
            var config = Object.assign({
                container: document.body,
                playlist: [],
                audioId: 'myAudio',
                sourceId: 'source-audio',
                titleSelector: '.title',
                timerSelector: '.timer',
                durationSelector: '.duration',
                progressSelector: '#myProgress',
                progressBarSelector: '#myBar',
                playIconSelector: '#icon-play',
                pauseIconSelector: '#icon-pause',
                volumeUpSelector: '#icon-vol-up',
                volumeMuteSelector: '#icon-vol-mute',
                toggleMuteSelector: '#toggleMute',
                playlistSelector: '.playlist-ctn',
                root: null,
                playerRoot: null
            }, options || {});

            var root = config.root || config.playerRoot || document.body;

            function resolveMediaUrl(filePath) {
                if (!filePath) return '';
                if (/^https?:\/\//i.test(filePath)) return filePath;
                if (/^\/\//.test(filePath)) return filePath;
                try {
                    return new URL(filePath, window.location.href).toString();
                } catch (err) {
                    return filePath.replace(/\\/g, '/');
                }
            }

            var state = {
                playlist: config.playlist,
                currentAudio: null,
                indexAudio: 0,
                timer: root.querySelector(config.timerSelector),
                barProgress: root.querySelector(config.progressBarSelector),
                progressbar: root.querySelector(config.progressSelector),
                currentTitle: root.querySelector(config.titleSelector),
                durationEl: root.querySelector(config.durationSelector),
                audioEl: root.querySelector('#' + config.audioId),
                sourceEl: root.querySelector('#' + config.sourceId),
                playlistContainer: root.querySelector(config.playlistSelector),
                playIcon: root.querySelector(config.playIconSelector),
                pauseIcon: root.querySelector(config.pauseIconSelector),
                volumeUp: root.querySelector(config.volumeUpSelector),
                volumeMute: root.querySelector(config.volumeMuteSelector),
                toggleMuteBtn: root.querySelector(config.toggleMuteSelector)
            };

            if (!state.progressbar && config.progressSelector) {
                state.progressbar = root.querySelector(config.progressSelector.replace('#', ''));
            }
            if (!state.barProgress && config.progressBarSelector) {
                state.barProgress = root.querySelector(config.progressBarSelector.replace('#', ''));
            }

            function createTrackItem(index, name, duration) {
                var trackItem = document.createElement('div');
                trackItem.className = 'playlist-track-ctn';
                trackItem.id = 'ptc-' + index;
                trackItem.setAttribute('data-index', index);

                if (state.playlistContainer) {
                    state.playlistContainer.appendChild(trackItem);
                }

                var playBtnItem = document.createElement('div');
                playBtnItem.className = 'playlist-btn-play';
                playBtnItem.id = 'pbp-' + index;
                trackItem.appendChild(playBtnItem);

                var btnImg = document.createElement('i');
                btnImg.className = 'fas fa-play';
                btnImg.height = '40';
                btnImg.width = '40';
                btnImg.id = 'p-img-' + index;
                playBtnItem.appendChild(btnImg);

                var trackInfoItem = document.createElement('div');
                trackInfoItem.className = 'playlist-info-track';
                trackInfoItem.innerHTML = name;
                trackItem.appendChild(trackInfoItem);

                var trackDurationItem = document.createElement('div');
                trackDurationItem.className = 'playlist-duration';
                trackDurationItem.innerHTML = duration;
                trackItem.appendChild(trackDurationItem);
            }

            function getMinutes(t) {
                var min = parseInt(parseInt(t) / 60, 10);
                var sec = parseInt(t % 60, 10);
                if (sec < 10) sec = '0' + sec;
                if (min < 10) min = '0' + min;
                return min + ':' + sec;
            }

            function setBarProgress() {
                if (!state.currentAudio || !state.currentAudio.duration) return;
                var progress = (state.currentAudio.currentTime / state.currentAudio.duration) * 100;
                if (state.barProgress) state.barProgress.style.width = progress + '%';
            }

            function updateStylePlaylist(oldIndex, newIndex) {
                var oldTrack = root.querySelector('#ptc-' + oldIndex);
                var newTrack = root.querySelector('#ptc-' + newIndex);
                if (oldTrack) oldTrack.classList.remove('active-track');
                pauseToPlay(oldIndex);
                if (newTrack) newTrack.classList.add('active-track');
                playToPause(newIndex);
            }

            function playToPause(index) {
                var ele = root.querySelector('#p-img-' + index);
                if (ele) {
                    ele.classList.remove('fa-play');
                    ele.classList.add('fa-pause');
                }
            }

            function pauseToPlay(index) {
                var ele = root.querySelector('#p-img-' + index);
                if (ele) {
                    ele.classList.remove('fa-pause');
                    ele.classList.add('fa-play');
                }
            }

            function loadNewTrack(index) {
                if (!state.playlist[index]) return;
                if (state.sourceEl) {
                    state.sourceEl.src = resolveMediaUrl(state.playlist[index].file);
                }
                if (state.currentTitle) state.currentTitle.innerHTML = state.playlist[index].name;
                state.currentAudio = state.audioEl;
                if (state.currentAudio) {
                    state.currentAudio.load();
                    state.currentAudio.play()
                        .then(function () { setPlaybackUI(true); })
                        .catch(function () { setPlaybackUI(false); });
                }
                updateStylePlaylist(state.indexAudio, index);
                state.indexAudio = index;
            }

            function setPlaybackUI(isPlaying) {
                if (state.playIcon) state.playIcon.style.display = isPlaying ? 'none' : 'block';
                if (state.pauseIcon) state.pauseIcon.style.display = isPlaying ? 'block' : 'none';

                if (state.playlistContainer) {
                    var activeTrack = root.querySelector('#ptc-' + state.indexAudio);
                    if (activeTrack) {
                        if (isPlaying) {
                            activeTrack.classList.add('active-track');
                        } else {
                            activeTrack.classList.remove('active-track');
                        }
                    }
                }

                if (isPlaying) {
                    playToPause(state.indexAudio);
                } else {
                    pauseToPlay(state.indexAudio);
                }
            }

            function playAudio() {
                if (!state.currentAudio) return;
                if (state.currentAudio.paused) {
                    setPlaybackUI(true);
                    state.currentAudio.play().catch(function () {});
                } else {
                    setPlaybackUI(true);
                }
            }

            function pauseAudio() {
                if (!state.currentAudio) return;
                if (!state.currentAudio.paused) {
                    state.currentAudio.pause();
                }
                setPlaybackUI(false);
            }

            function toggleAudio() {
                if (!state.currentAudio) return;
                if (state.currentAudio.paused) {
                    playAudio();
                } else {
                    pauseAudio();
                }
            }

            function onTimeUpdate() {
                if (!state.currentAudio) return;
                if (state.timer) state.timer.innerHTML = getMinutes(state.currentAudio.currentTime);
                setBarProgress();
                if (state.currentAudio.ended) {
                    if (state.playIcon) state.playIcon.style.display = 'block';
                    if (state.pauseIcon) state.pauseIcon.style.display = 'none';
                    pauseToPlay(state.indexAudio);
                    if (state.indexAudio < state.playlist.length - 1) {
                        loadNewTrack(state.indexAudio + 1);
                    }
                }
            }

            function seek(event) {
                if (!state.currentAudio || !state.progressbar) return;
                var rect = state.progressbar.getBoundingClientRect();
                var percent = (event.clientX - rect.left) / rect.width;
                percent = Math.min(Math.max(percent, 0), 1); // clamp to [0,1]
                state.currentAudio.currentTime = percent * state.currentAudio.duration;
                if (state.barProgress) state.barProgress.style.width = (percent * 100) + '%';
            }

            function forward() {
                if (!state.currentAudio) return;
                state.currentAudio.currentTime += 5;
                setBarProgress();
            }

            function rewind() {
                if (!state.currentAudio) return;
                state.currentAudio.currentTime -= 5;
                setBarProgress();
            }

            function next() {
                if (state.indexAudio < state.playlist.length - 1) {
                    var oldIndex = state.indexAudio;
                    state.indexAudio++;
                    updateStylePlaylist(oldIndex, state.indexAudio);
                    loadNewTrack(state.indexAudio);
                }
            }

            function previous() {
                if (state.indexAudio > 0) {
                    var oldIndex = state.indexAudio;
                    state.indexAudio--;
                    updateStylePlaylist(oldIndex, state.indexAudio);
                    loadNewTrack(state.indexAudio);
                }
            }

            function toggleMute() {
                if (!state.currentAudio) return;
                if (state.currentAudio.muted === false) {
                    state.currentAudio.muted = true;
                    if (state.volumeUp) state.volumeUp.style.display = 'none';
                    if (state.volumeMute) state.volumeMute.style.display = 'block';
                } else {
                    state.currentAudio.muted = false;
                    if (state.volumeMute) state.volumeMute.style.display = 'none';
                    if (state.volumeUp) state.volumeUp.style.display = 'block';
                }
            }

            function getClickedElement(event) {
                var trackItem = event.target.closest('.playlist-track-ctn');
                if (!trackItem) return;

                var clickedIndex = trackItem.getAttribute('data-index');
                if (clickedIndex == null) return;

                var targetIdx = parseInt(clickedIndex, 10);
                if (targetIdx === state.indexAudio) {
                    toggleAudio();
                } else {
                    loadNewTrack(targetIdx);
                }
            }

            function bindEvents() {
                if (state.progressbar) {
                    state.progressbar.addEventListener('click', seek);
                }
                if (state.toggleMuteBtn) {
                    state.toggleMuteBtn.addEventListener('click', toggleMute);
                }

                var playlistItems = root.querySelectorAll('.playlist-track-ctn');
                playlistItems.forEach(function (item) {
                    item.addEventListener('click', getClickedElement);
                });
            }

            function init() {
                state.playlist.forEach(function (track, index) {
                    createTrackItem(index, track.name, track.duration);
                });

                if (state.audioEl && state.sourceEl) {
                    if (state.playlist && state.playlist.length > 0) {
                        state.sourceEl.src = resolveMediaUrl(state.playlist[0].file);
                        state.audioEl.load();
                        state.currentAudio = state.audioEl;
                        if (state.currentTitle) state.currentTitle.innerHTML = state.playlist[0].name;
                        if (state.durationEl) state.durationEl.innerHTML = '00:00';
                        if (state.timer) state.timer.innerHTML = '00:00';
                    }
                    
                }

                bindEvents();
            }

            init();

            return {
                play: playAudio,
                pause: pauseAudio,
                next: next,
                previous: previous,
                forward: forward,
                rewind: rewind,
                seek: seek,
                toggleMute: toggleMute,
                loadTrack: loadNewTrack,
                onTimeUpdate: onTimeUpdate,
                getMinutes: getMinutes
            };
        }

    </script>
    <script>
        async function loadProjects() {
        const res = await fetch('../data/projects.json');
        return res.json();
        }

        function renderMedia(p) {
        if (p.type === 'audio') {
            return `
            <div id="${p.slug}-player">
                <audio id="${p.slug}-audio" ontimeupdate="window['${p.slug}Player'] && window['${p.slug}Player'].onTimeUpdate()">
                <source id="${p.slug}-source" src="" type="audio/mpeg">
                </audio>
                <div class="d-flex justify-content-center align-items-center">
                <div id="${p.slug}-progress"><div id="${p.slug}-bar"></div></div>
                </div>
                <div class="btn-ctn">
                <div class="btn-action first-btn" onclick="window['${p.slug}Player'] && window['${p.slug}Player'].previous()"><i class="fas fa-step-backward"></i></div>
                <div class="btn-action" onclick="window['${p.slug}Player'] && window['${p.slug}Player'].rewind()"><i class="fas fa-backward"></i></div>
                <div class="btn-play" onclick="window['${p.slug}Player'] && window['${p.slug}Player'].forward()"><i class="fas fa-forward"></i></div>
                <div class="btn-action" onclick="window['${p.slug}Player'] && window['${p.slug}Player'].next()"><i class="fas fa-step-forward"></i></div>
                </div>
                <div class="playlist-ctn mt-3"></div>
            </div>`;
        }
        if (p.type === 'video') {
            return `<video width="100%" height="auto" controls>
            <source src="${p.video}" type="video/mp4">
            Your browser does not support the video tag.
            </video>`;
        }
        if (p.type === 'pdf') {
            return `<a href="${p.pdf}" target="_blank"><img src="${p.img}" alt="${p.title} Viewbook"></a>`;
        }
        return '';
        }

        function renderProjects(projects) {
        const grid = document.getElementById('container');
        const stage = document.querySelector('.modal-stage');

        projects.forEach(p => {
            grid.insertAdjacentHTML('beforeend', `
            <div class="col-12 col-md-6 masonryImage">
                <a class="js-modal-trigger portfolio-item" href="#${p.slug}-modal">
                <div class="caption">
                    <div class="caption-content">
                    <h3>${p.title}</h3>
                    <h2>${p.credit || ''}</h2>
                    </div>
                </div>
                <img class="img-fluid" style="filter: brightness(${p.brightness})" src="${p.thumbnail}" alt="${p.title}" />
                </a>
            </div>
            `);

            stage.insertAdjacentHTML('beforeend', `
            <div id="${p.slug}-modal" class="modal-panel">
                <a class="js-modal-close" href="#"></a>
                <div class="modal-body">
                <div class="description">
                    <h1>${p.title}</h1>
                    <p>${p.credit || ''}</p>
                    ${p.layout === 'full' ? `
                    <div class="row g-4 justify-content-between">
                        <div class="col-12">
                        ${renderMedia(p)}
                        </div>
                    </div>
                    ` : `
                    <div class="row g-4 justify-content-between">
                        <div class="col-12 col-md-4">
                        <h2>Synopsis</h2>
                        <p>${p.synopsis || ''}</p>
                        </div>
                        <div class="col-12 col-md-6">
                        ${renderMedia(p)}
                        </div>
                    </div>
                    `}
                </div>
                </div>
            </div>
            `);

            if (p.type === 'audio' && p.playlist && p.playlist.length) {
            window[p.slug + 'Player'] = createAudioPlayer({
                root: document.getElementById(p.slug + '-player'),
                audioId: p.slug + '-audio',
                sourceId: p.slug + '-source',
                progressSelector: '#' + p.slug + '-progress',
                progressBarSelector: '#' + p.slug + '-bar',
                playlistSelector: '.playlist-ctn',
                playlist: p.playlist
            });
            }
        });
        }

        loadProjects().then(projects => {
        renderProjects(projects);
        $('#container').imagesLoaded(function () {
            $('#container').masonry({ itemSelector: '.masonryImage', percentPosition: true });
        });
        });
    </script>
    <script>
        $(document).on('click', '.js-modal-trigger', function (e) {
            e.preventDefault();
            var targetSelector = $(this).attr('href'); 

            // close any panel that's already open, then open the target
            $('.modal-panel').removeClass('is-open');
            $(targetSelector).addClass('is-open');

            // scroll back up to the top of the stage so the pull-down is visible
            $('html, body').animate({
            scrollTop: parseInt($('#top').offset().top)
            }, 400);
        });

        $(document).on('click', '.js-modal-close', function (e) {
            e.preventDefault();
            var $panel = $(this).closest('.modal-panel');
            $panel.removeClass('is-open');

            $panel.find('video').each(function () {
                this.pause();
            });

            var panelId = $panel.attr('id');
            var playerMap = {
                'astorville-modal': window.astorvillePlayer,
                'axeman-modal': window.axemanPlayer,
                'cryptid-modal': window.cryptidPlayer

            };
            var player = playerMap[panelId];
            if (player && typeof player.pause === 'function') {
                player.pause();
            }
        });
    </script>
